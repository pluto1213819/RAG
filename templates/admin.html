<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RAG Admin</title>
  <style>body{font-family:Arial;max-width:900px;margin:40px auto}input,button{padding:8px;margin:6px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:6px}</style>
</head>
<body>
  <h2>生产化 RAG 管理后台（示例）</h2>
  <div>
    <input id="email" placeholder="email" value="owner@example.com">
    <input id="password" type="password" placeholder="password" value="owner123">
    <button onclick="login()">登录</button>
    <span id="token"></span>
  </div>
  <hr>
  <div>
    <input id="query" placeholder="输入问题" value="什么是 RAG？">
    <button onclick="ask()">检索问答</button>
    <pre id="answer"></pre>
  </div>
  <hr>
  <div>
    <button onclick="logs()">加载审计日志</button>
    <table><thead><tr><th>ID</th><th>Action</th><th>Time</th></tr></thead><tbody id="logbody"></tbody></table>
  </div>
<script>
let TOKEN = "";
async function login(){
  const r = await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
  const j = await r.json(); TOKEN = j.access_token; document.getElementById("token").innerText="已登录";
}
async function ask(){
  const r = await fetch("/api/docs/query",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify({query:document.getElementById("query").value,top_k:3})});
  document.getElementById("answer").innerText=JSON.stringify(await r.json(),null,2);
}
async function logs(){
  const r = await fetch("/api/admin/audit-logs",{headers:{"Authorization":"Bearer "+TOKEN}});
  const arr = await r.json();
  const tb = document.getElementById("logbody"); tb.innerHTML="";
  arr.forEach(x=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${x.id}</td><td>${x.action}</td><td>${x.created_at}</td>`;tb.appendChild(tr);});
}
</script>
</body>
</html>
