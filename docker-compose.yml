version: "3.9"
services:
  rag-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./templates:/app/templates
      - ./rag.db:/app/rag.db
    environment:
      - DATABASE_URL=sqlite:///rag.db
      - OLLAMA_URL=http://host.docker.internal:11434
      - EMBED_MODEL=bge-m3
      - LLM_MODEL=qwen2.5:7b
      - CHROMA_DIR=/app/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
